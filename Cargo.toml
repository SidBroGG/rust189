[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/world",
    "crates/render",
    "crates/gui",
    "crates/assets",
    "crates/client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Alex <rust189>"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Async & Networking
tokio = { version = "1.43", features = ["full"] }
bytes = "1.10"
byteorder = "1.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

# Serialization & Data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
flate2 = "1.0"
uuid = { version = "1.11", features = ["v4", "v3", "fast-rng", "serde"] }

# Cryptography & Hash
sha1 = "0.10"
md-5 = "0.10"
aes = "0.8"
cfb-mode = "0.8"

# Graphics & Windowing
wgpu = "24.0"
winit = { version = "0.30", features = ["rwh_06"] }
bytemuck = { version = "1.20", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
glam = { version = "0.29", features = ["bytemuck", "serde"] }

# UI
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = { version = "0.31", default-features = false, features = ["links"] }
arboard = "3.4"

# Audio
rodio = { version = "0.20", default-features = false, features = ["vorbis", "wav"] }

# Utility & Profiling
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
pollster = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
bitvec = "1.0"
hashbrown = { version = "0.15", features = ["serde"] }
rayon = "1.10"

# Internal workspace crates
protocol = { path = "crates/protocol" }
world = { path = "crates/world" }
render = { path = "crates/render" }
gui = { path = "crates/gui" }
assets = { path = "crates/assets" }

[profile.dev]
codegen-units = 1
incremental = false

[profile.release]
opt-level = 3
lto = "thin"
